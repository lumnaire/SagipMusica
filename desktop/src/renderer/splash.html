<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Tighter than the app's own policy: this page runs no script at all, so
      everything but its own markup, styles and logo is denied outright.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>SagipMusica</title>
    <style>
      /*
        The splash is deliberately CSS-only. It has to be on screen before the
        renderer bundle has finished parsing, which is the one thing a script
        here would make impossible.

        Colours are the app's own tokens from src/index.css, written as literal
        oklch() rather than var(): this page never loads the stylesheet.
      */
      :root {
        --sidebar: oklch(0.2 0.025 265);
        --sidebar-foreground: oklch(0.92 0.01 90);
        --sidebar-border: oklch(0.3 0.03 265);
        --sidebar-primary: oklch(0.62 0.14 150);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        /* The window itself is transparent; the card below is the only thing
           that paints. */
        background: transparent;
        overflow: hidden;
        /* A splash that reacts to clicks reads as a window the user is
           supposed to do something with. */
        user-select: none;
        cursor: default;
      }

      body {
        display: grid;
        place-items: center;
        /* Room for the card's shadow to fall inside the window. */
        padding: 14px;
        -webkit-app-region: drag;
      }

      .card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 30px 34px 34px;
        border-radius: 18px;
        background: var(--sidebar);
        border: 1px solid var(--sidebar-border);
        box-shadow:
          0 18px 44px rgb(0 0 0 / 34%),
          0 2px 8px rgb(0 0 0 / 22%);
        /* Everything animates from here, so the whole card arrives as one
           object rather than as parts assembling themselves. */
        animation: card-in 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .logo {
        width: 78px;
        height: 78px;
        object-fit: contain;
        animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 70ms both;
      }

      .wordmark {
        /* System serif on purpose: Fraunces would have to be fetched and
           swapped in, and a font swapping mid-fade is exactly the flicker this
           screen exists to avoid. */
        font-family: Georgia, "Times New Roman", serif;
        font-size: 25px;
        letter-spacing: 0.01em;
        color: var(--sidebar-foreground);
        animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 150ms both;
      }

      .tagline {
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 11.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: color-mix(in oklch, var(--sidebar-foreground) 52%, transparent);
        animation: rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 210ms both;
      }

      .track {
        position: relative;
        width: 132px;
        height: 2.5px;
        margin-top: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: color-mix(in oklch, var(--sidebar-foreground) 12%, transparent);
        animation: fade 400ms ease-out 280ms both;
      }

      /* Indeterminate on purpose. There is nothing real to measure — the app
         is usually up in well under a second — and a bar that claims a
         percentage it does not know is worse than one that just moves. */
      .track::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: var(--sidebar-primary);
        animation: sweep 1250ms ease-in-out infinite;
      }

      @keyframes card-in {
        from {
          opacity: 0;
          transform: scale(0.975);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(7px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes sweep {
        0% {
          transform: translateX(-105%);
        }
        100% {
          transform: translateX(240%);
        }
      }

      /* Respect the setting rather than ignoring it for a "nice" animation:
         the card still fades, it just stops moving. */
      @media (prefers-reduced-motion: reduce) {
        .card,
        .logo,
        .wordmark,
        .tagline,
        .track {
          animation: fade 260ms ease-out both;
        }
        .track::after {
          animation: none;
          width: 100%;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Resolved and hashed by Vite into the renderer bundle, so it is
           served from app:// like every other asset. -->
      <img class="logo" src="../../../src/assets/sagipmusica-logo1.png" alt="" />
      <p class="wordmark">SagipMusica</p>
      <p class="tagline">Preparing your hymnal</p>
      <div class="track"></div>
    </div>
  </body>
</html>
